# 通用設置
general {
    grab_focus = true
}

# 歷史紀錄與快取
cache {
    enabled = true
}

# 搜尋器前綴與行為設置
finders {
    default_finder = desktop
    
    # 搜尋模式觸發前綴
    math_prefix = =        # 輸入 "=1+1" 進行數學計算
    unicode_prefix = .     # 輸入 ".smile" 搜尋表情與符號
    
    # 圖示顯示
    desktop_icons = true
    
    # 如果你有使用 uwsm 包裹啟動應用程式，可以解開下行：
    # desktop_launch_prefix = uwsm app -- 
}

# 視窗外觀與尺寸
ui {
    # 設定視窗寬度 500px，高度 350px
    window_size = 500 350
}
