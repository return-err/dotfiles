general {
    hide_cursor = true          # 鎖屏時隱藏游標
}

background {
    monitor =
    path = screenshot           # 使用當前桌面截圖作為背景
    blur_passes = 3             # 開啟背景模糊
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true        # 輸入框為空時淡出
    placeholder_text = <i>Password...</i>
}
